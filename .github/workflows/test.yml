name: CI
on:
    push:
        branches-ignore:
            - 'release/*'
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            # publish.yml upgrades to npm@latest before prepublishOnly. Matching it here keeps
            # CI on the same npm as a real release, so npm-version regressions in the release
            # tooling fail in CI instead of only surfacing during a publish.
            - name: Upgrade npm to latest
              run: npm install -g npm@latest
            - name: Report npm version
              run: npm --version
            - name: Install dependencies
              run: npm ci
            - name: Run lint
              run: npm run lint
            - name: Run license check
              run: npm run test:license
            - name: Run tests
              run: npm test
