name: CI
on:
    push:
        branches-ignore:
            - 'release/*'
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, macos-15]
                npm: [bundled]
                # publish.yml upgrades to npm@latest before prepublishOnly, so npm-version
                # regressions in the release tooling are invisible to the bundled-npm legs
                # and would otherwise only surface during a release. One Linux leg is enough
                # to catch them; the sensitivity is to the npm version, not the OS.
                include:
                    - os: ubuntu-24.04
                      npm: latest
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - name: Upgrade npm to latest
              if: matrix.npm == 'latest'
              run: npm install -g npm@latest
            - name: Report npm version
              run: npm --version
            - name: Install dependencies
              run: npm ci
            - name: Run lint
              run: npm run lint
            - name: Run license check
              run: npm run test:license
            - name: Run tests
              run: npm test
